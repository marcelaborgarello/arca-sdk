name: Release

# Publica en npm con **trusted publishing** (OIDC): no hay token que guardar ni rotar.
# GitHub firma un token efímero para esta corrida y npm lo valida contra la
# configuración del paquete. Reemplaza al Granular Access Token con bypass de 2FA,
# que npm deprecó en agosto de 2026 y deja de poder publicar hacia enero de 2027.
#
# Requiere configurar el trusted publisher una vez en npmjs.com. Ver RELEASING.md §2.
#
# Se dispara al pushear un tag de versión:
#   git tag -a v2.0.0 -m "v2.0.0" && git push origin --tags

on:
  push:
    tags:
      - 'v*'
  # Permite reintentar desde la pestaña Actions sin tener que mover el tag.
  workflow_dispatch:

permissions:
  # Sin esto no hay OIDC y el publish cae al método viejo (token), que ya no anda.
  id-token: write
  contents: read

jobs:
  publish:
    name: Publicar en npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # El proyecto usa Bun: `prepublishOnly` corre `bun run build && bun run test`,
      # así que tiene que estar disponible aunque publiquemos con npm.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # El publish va con npm, que es quien implementa OIDC.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing necesita npm >= 11.5.1. Node 24 ya trae npm 11, pero se
      # fuerza igual para no depender de qué versión venga con la imagen del runner.
      - name: Actualizar npm
        run: npm install -g npm@latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar que el tag coincida con package.json
        # Publicar v2.0.0 desde un package.json que dice otra cosa deja el tag de git
        # y la versión de npm apuntando a cosas distintas, y eso no se puede deshacer.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "El tag ($TAG) no coincide con package.json ($PKG)."
            exit 1
          fi
          echo "Versión $PKG — coincide."

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      # `prepublishOnly` vuelve a correr build + test: es la última red antes de subir
      # algo irreversible. npm genera las provenance attestations solo, sin --provenance.
      - name: Publicar
        run: npm publish
