name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Type Check)
        run: bun run lint

      - name: Build
        run: bun run build

      # `bun run test` (vitest run), no `bun test`: son runners distintos y bajo el
      # runner nativo de Bun los `vi.mock` se filtran entre archivos, con lo cual la
      # suite es menos confiable de lo que parece. vitest aísla por archivo.
      # Los tests de integración quedan fuera: pegan contra ARCA homologación.
      - name: Run Tests
        run: bun run test
